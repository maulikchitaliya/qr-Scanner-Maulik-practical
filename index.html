
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Scanner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="phone">
        <div class="header">
            <div class="title"><span>QR</span> Scanner</div>
            <div class="status"><i></i> Scanning...</div>
        </div>

        <div class="scanner">
            <video id="video" autoplay muted playsinline></video>
            <div class="frame">
                <b></b><b></b><b></b><b></b>
            </div>
        </div>

        <div class="history-head">
            <span>Scanned <strong id="count">0</strong></span>
            <button id="clear">Clear</button>
        </div>

        <div id="results"></div>
    </div>

    <script src="qr.js"></script>
</body>
</html>
